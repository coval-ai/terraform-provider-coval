name: Release Automation

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: terraform-provider-coval-release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release
    if: github.actor != 'coval-release-automation[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare version, changelog, tag, and draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run release
