name: Release Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: terraform-provider-coval-release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release
    if: github.event_name == 'workflow_dispatch' || github.actor != 'coval-release-automation[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify release source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "Release Automation must be dispatched from main." >&2
            exit 1
          fi
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare version, changelog, tag, and draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm run release
